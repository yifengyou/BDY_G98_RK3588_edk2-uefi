name: BDY G98 Build

on:
  push:
    branches:
      - bdy-g98
  repository_dispatch:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update && \
          sudo apt-get install -y -qq \
          acpica-tools \
          binutils-aarch64-linux-gnu \
          build-essential \
          device-tree-compiler \
          gettext \
          git \
          gcc-aarch64-linux-gnu \
          libc6-dev-arm64-cross \
          python3 \
          python3-pyelftools \
          uuid-dev rar

      - name: Build EDK2 UEFI
        shell: bash
        run: |
          ./kdev-build.sh

      - name: Show output
        shell: bash
        run: |
          ls -alh release
          sha256sum release/*

      - name: Upload EDK2 UEFI to Release
        uses: ncipollo/release-action@main
        with:
          tag: bdy-g98-edk2-uefi
          artifacts: ./release/RK3588*
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            # EDK2 UEFI For Bdy G98

            ## 免责声明

            - **按原样提供**：本镜像不作任何明示或暗示的保证，使用风险由用户自行承担。
            - **无官方关联**：本项目与 Rockchip、任何商业实体无关，为非盈利自由分享。
            - **安全提示**：部署后请及时更新安全补丁、修改默认密码、配置防火墙及访问控制策略。
